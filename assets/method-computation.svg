<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="t d"><title id="t">Computational chemistry workflow</title><desc id="d">A conceptual workflow from molecular geometry through DFT and TD-DFT calculations to electronic-structure interpretation, with no orbital energies or surfaces depicted.</desc><g fill="#edf5f4" stroke="#a6c4c2" stroke-width="1.5"><rect x="23" y="64" width="145" height="92" rx="5"/><rect x="227" y="64" width="145" height="92" rx="5"/><rect x="431" y="64" width="145" height="92" rx="5"/></g><g stroke="#126d69" stroke-width="2" fill="none"><path d="M179 110h35m-9-8 9 8-9 8M383 110h35m-9-8 9 8-9 8"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183247" font-size="17"><text x="95" y="104">Molecular</text><text x="95" y="127">geometry</text><text x="300" y="104">DFT /</text><text x="300" y="127">TD-DFT</text><text x="504" y="104">Electronic</text><text x="504" y="127">structure</text></g><text x="300" y="209" font-family="Arial,sans-serif" text-anchor="middle" fill="#586d7a" font-size="14">Calculation → interpretation</text></svg>