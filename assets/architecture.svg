<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Donor, conjugated bridge and acceptor design</title><desc id="d">Conceptual molecular design showing donor, pi bridge and acceptor as three connected units. This is a design schematic, not a charge-density plot.</desc><rect width="900" height="420" rx="12" fill="#f0f6f6"/><g font-family="Arial,sans-serif"><text x="45" y="49" fill="#167a77" font-size="12" letter-spacing="3">MOLECULAR ARCHITECTURE</text><g stroke="#96b8b9" stroke-width="3"><path d="M257 200H365M535 200H643"/></g><rect x="70" y="130" width="187" height="140" rx="10" fill="#d5ebe6"/><rect x="365" y="130" width="170" height="140" rx="10" fill="#dfe8f0"/><rect x="643" y="130" width="187" height="140" rx="10" fill="#f0e3d8"/><g text-anchor="middle"><text x="163" y="205" font-size="46" fill="#167a77">D</text><text x="163" y="242" font-size="15" fill="#203b4b">Electron donor</text><text x="450" y="205" font-size="46" fill="#405f8c">π</text><text x="450" y="242" font-size="15" fill="#203b4b">Conjugated bridge</text><text x="736" y="205" font-size="46" fill="#9b6248">A</text><text x="736" y="242" font-size="15" fill="#203b4b">Electron acceptor</text><text x="450" y="332" font-size="21" fill="#203b4b">Tune substitution. Compare architecture. Understand function.</text><text x="450" y="382" font-size="12" fill="#5d727d">Conceptual design schematic · Not a measured spectrum or calculated charge-density map</text></g></g></svg>